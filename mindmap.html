<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central Dogma Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a single-screen "wiring diagram" of the cell — map canvas left, explainer + animation stage right (stacked on phones) */
:root{
  --bg:#0e1022; --panel:#161936; --panel2:#1e2246; --line:#2d3266; --fg:#ecebf7; --muted:#a1a3c8;
  --core:#ecebf7; --proc:#4fc4b8; --enz:#ffa53d; --tool:#a58cff; --virus:#ff8fb8; --uv:#7fd6ff; --red:#ff6b81; --green:#6fdca6;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body)}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:18px 10px;max-width:1500px;margin:0 auto}
h1{font:800 clamp(22px,3.6vw,30px)/1 var(--f-display);margin:0}
header small{display:block;color:var(--muted);font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
a{color:var(--uv)}
.back{font:600 14px var(--f-body);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:1500px;margin:0 auto 12px}
.bar .lab{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chipbtn{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer}
.chipbtn:hover{border-color:var(--uv)}
.chipbtn[aria-pressed="true"]{background:var(--panel2);border-color:var(--uv)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font:12px var(--f-mono);color:var(--muted);max-width:1500px;margin:0 auto 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.legend b{display:inline-block;width:22px;height:0;border-top:2px solid;margin-right:6px;vertical-align:3px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;max-width:1500px;margin:0 auto;align-items:start}
@media (max-width:1100px){.wrap{grid-template-columns:minmax(0,1fr)}}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;min-width:0}
.mapbox svg{display:block;width:100%;min-width:860px;height:auto}
.node{cursor:pointer}
.node text{pointer-events:none;font-family:var(--f-body)}
.node:focus{outline:none}
.node:focus-visible .shape,.node:hover .shape{stroke:var(--uv);stroke-width:2.5}
.node.sel .shape{stroke:#fff;stroke-width:3}
.dim{opacity:.18;transition:opacity .25s}
.edge{transition:opacity .25s,stroke-width .25s}
.edge.hot{stroke-width:3.2!important;opacity:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 18px 20px;min-width:0;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:1100px){.panel{position:static;max-height:none}}
.kind{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.panel h2{font:800 24px/1.15 var(--f-display);margin:4px 0 8px;text-wrap:balance}
.one{font-size:16px;margin:0 0 10px}
.panel ul{margin:0 0 10px;padding-left:20px}.panel li{margin:4px 0}
.panel h3{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--enz);margin:16px 0 6px}
.exam{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.conns{display:flex;flex-wrap:wrap;gap:6px}
.conn{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;font:13px var(--f-body);cursor:pointer;text-align:left}
.conn:hover{border-color:var(--uv)}
.conn small{display:block;color:var(--muted);font-size:12px}
.stage{background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-top:6px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.stage text{font-family:var(--f-mono);fill:var(--fg);font-size:13px}
.stage text.s{font-size:11px;fill:var(--muted)}
.stage [data-s],.stage [data-m],.stage [data-o]{transition:opacity .55s ease,transform .9s cubic-bezier(.4,.1,.2,1),stroke-dashoffset 1.1s ease}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:600 13px var(--f-body);cursor:pointer}
.btn:hover{border-color:var(--uv)}.btn.primary{background:var(--enz);border-color:var(--enz);color:#2a1700}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:5px;margin-left:auto}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--uv)}
.cap{margin-top:10px;font-size:15px;min-height:3.2em}
.cap b{color:var(--uv)}
.tourbar{display:none;background:var(--panel2);border:1px solid var(--uv);border-radius:10px;padding:10px 12px;margin-bottom:12px;gap:10px;align-items:center;flex-wrap:wrap}
.tourbar.on{display:flex}
.tourbar span{flex:1;min-width:180px;font-size:14px}
.empty p{color:var(--muted)}
code{font-family:var(--f-mono);color:var(--uv);font-size:.92em}
@media (prefers-reduced-motion:reduce){.stage [data-s],.stage [data-m],.stage [data-o],.dim,.edge{transition:none!important}}
</style>
</head>
<body>
<header>
  <div><h1>Central Dogma Map</h1><small>7.012 Exam II · how everything connects</small></div>

SC.rep={w:680,h:300,steps:[

 "<b>Helicase</b> (green) unwinds the strands at the fork. <b>Topoisomerase</b> (violet) cuts and reseals the backbone ahead of the fork to relieve overwinding.",

const INFO={
dna:{one:"The long-term information store: two antiparallel strands of nucleotides held together by A–T and G–C base pairs.",b:["Nucleotide = deoxyribose (2′-H) + base + phosphate(s). Purines A, G (2 rings); pyrimidines C, T (1 ring).","Within a strand: <b>phosphodiester bonds</b> (covalent, the backbone). Between strands: <b>hydrogen bonds</b> (A–T 2, G–C 3).","Strands run 5′→3′ in opposite directions. Write sequences 5′→3′. Complementary strand = complement, then reverse.","Genes can sit on either strand. The promoter's orientation picks which strand is the template.","Chargaff: in dsDNA A = T and G = C. If not, the genome is single-stranded."],exam:"New nucleotides attach to the 3′-OH via the α-phosphate (PPi leaves). That's why everything is made 5′→3′ and needs a primer.",scene:"nuc"},
rna:{one:"The working copy: single-stranded, ribose (2′-OH), uses U instead of T.",b:["<b>mRNA</b> carries the code; <b>tRNA</b> is the adapter (anticodon ↔ codon); <b>rRNA</b> is the ribosome's catalyst; <b>lncRNAs</b> act as RNA scaffolds.","Made by RNA polymerase from a DNA template, 5′→3′, no primer needed.","mRNA = coding-strand sequence with U. It's complementary to the template.","The 2′-OH makes RNA reactive and short-lived: good for messages, bad for storage.","Eukaryotic mRNA gets a cap, a poly(A) tail, and splicing before it leaves the nucleus."],exam:"Which strand matches the mRNA? The coding (non-template) strand, with T→U."},
protein:{one:"The workers: chains of amino acids built N → C by ribosomes, folded into 3D structures that do the cell's jobs.",b:["Sequence comes from mRNA codons (triplets, starting at AUG).","Mutations can change it: silent, missense, nonsense, frameshift.","Amount depends on transcription, mRNA stability, translation, and protein degradation.","Many proteins here are enzymes: helicase, polymerases, ligase, Cas9, restriction enzymes…"],exam:"Low protein with normal mRNA → translation or protein stability. Low mRNA → transcription."},
replication:{one:"DNA → DNA. The genome is copied semi-conservatively before every cell division.",b:["Starts at origins (1 in bacteria, many in eukaryotes). Two forks move apart.","Needs template, primer (3′-OH), dNTPs, and DNA polymerase.","<b>Leading</b> strand: continuous, toward the fork. <b>Lagging</b>: Okazaki fragments, away from the fork.","Meselson–Stahl (¹⁵N → ¹⁴N): gen 1 one hybrid band, gen 2 hybrid + light.","Linear chromosome ends shorten each round, which telomerase fixes."],exam:"Lagging = fork movement and synthesis in opposite directions. Each strand is leading at one fork and lagging at the other.",scene:"rep"},
transcription:{one:"DNA → RNA. RNA polymerase copies one strand of a gene into RNA.",b:["RNA pol binds the <b>promoter</b> (not transcribed) and starts at +1.","Reads the template 3′→5′ and builds RNA 5′→3′ from NTPs. No primer, no proofreading.","Product matches the coding strand (U for T).","Controlled by transcription factors (activators, repressors), enhancers, and chromatin."],exam:"Find the template: it's the strand complementary to the mRNA, read 3′→5′ moving away from the promoter.",scene:"tx"},
rtproc:{one:"RNA → DNA, the reverse of transcription, done by reverse transcriptase.",b:["Retroviruses (HIV) copy their RNA genome to DNA and integrate it.","Telomerase uses its own RNA template to extend chromosome ends.","LINE transposons copy themselves this way (and SINEs borrow LINE enzymes).","In the lab: mRNA → <b>cDNA</b> for libraries, RNA-seq, and expressing eukaryotic genes in bacteria."],exam:"cDNA has no introns and no promoter.",scene:"rt"},
processing:{one:"Eukaryotes turn pre-mRNA into mature mRNA in the nucleus.",b:["<b>5′ cap</b> (methyl-G, 5′–5′): stability, export, ribosome binding.","<b>Poly(A) tail</b>: added after cleavage at AAUAAA; stability.","<b>Splicing</b>: spliceosome removes introns (GU…AG) and joins exons.","Alternative splicing: one gene → several proteins.","Bacteria don't do any of this and can't splice."],exam:"Mutation in an intron → usually no protein change. 3 bp in an exon → one amino acid missing. 1 bp → frameshift.",scene:"proc"},
translation:{one:"RNA → protein. Ribosomes read mRNA codons and tRNAs bring matching amino acids.",b:["Starts at the first AUG (Met), reads 5′→3′ in triplets, stops at UAA/UAG/UGA.","Anticodon pairs <b>antiparallel</b> with the codon. Anticodon 5′→3′ = reverse complement of the codon.","rRNA catalyzes peptide bonds. Protein grows N → C.","The code is redundant (several codons per amino acid) but unambiguous, and nearly universal."],exam:"Count amino acids from AUG = 1. Written answers often want the step named: translation.",scene:"tl"},
rnarep:{one:"RNA → RNA, done by RNA-dependent RNA polymerase (RdRp). Only RNA viruses do this.",b:["Host cells have no RdRp.","+RNA viruses translate their genome to make RdRp.","−RNA viruses must bring RdRp inside the virion."],exam:"Naked +RNA genome is infectious; naked −RNA is not.",scene:"virus"},
regulation:{one:"Deciding which genes are on, when, and how much. It's why one genome makes many cell types.",b:["Repressors block RNA polymerase; activators recruit it.","Enhancers can act from far away by DNA looping.","Open chromatin = accessible; closed = mostly off.","Post-transcriptional: splicing choices and mRNA stability.","Measured by RNA-seq / scRNA-seq. Can be manipulated with dCas9."],exam:"Delete the repressor's site → always on. Delete the activator's site → can't be induced.",scene:"reg"},
mutations:{one:"Changes in DNA sequence, from replication errors or damage.",b:["Substitutions: silent, missense, nonsense.","Indels: not a multiple of 3 → frameshift; 3n → in-frame.","Intron changes are usually silent (unless they hit splice sites). Promoter changes alter amount, not sequence.","~30 new mutations per human generation. SNPs are common variants."],exam:"Base-pair notation: rewrite the coding-strand codon, convert to mRNA, then look it up.",scene:"mut"},
repair:{one:"Fixing mistakes and breaks.",b:["Proofreading: polymerase 3′→5′ exonuclease.","Mismatch repair: replaces part of the new strand.","NHEJ: joins broken ends (indels). HDR: copies a homologous template (precise)."],exam:"CRISPR knockout uses NHEJ; precise edit or insertion uses HDR + donor template.",scene:"repair"},
helicase:{one:"Unzips the double helix at the replication fork by breaking base-pair H-bonds.",b:["Sits at the fork junction, ahead of both new strands.","Without it, the fork never opens and neither strand is copied.","PCR and Sanger don't need it: heat separates the strands."],exam:"Helicase-dead → both leading and lagging stop.",scene:"rep",start:1},
topo:{one:"Relieves the overwinding (supercoiling) that builds up ahead of the fork.",b:["Cuts the backbone, lets it unwind, reseals. Changes topology, not sequence.","Without it, tension builds and the fork stalls."],exam:"Works ahead of the fork, in the still-double-stranded DNA.",scene:"rep",start:1},
primase:{one:"A special RNA polymerase that lays down short RNA primers so DNA polymerase has a 3′-OH to extend.",b:["Leading strand: one primer per fork. Lagging: one per Okazaki fragment.","Uses rNTPs. PCR and Sanger replace it with synthetic DNA primers.","Primers are later swapped for DNA (Pol I)."],exam:"\"Primase started at ___\": the primer's 5′ end.",scene:"rep",start:2},
dnapol:{one:"Builds DNA 5′→3′ by adding dNTPs to a 3′-OH, reading the template 3′→5′.",b:["Needs template, primer, dNTPs (+ Mg²⁺).","Proofreads with a 3′→5′ exonuclease.","Pol III does most copying; Pol I replaces primers (Cairns mutant).","Borrowed by PCR (Taq) and Sanger."],exam:"Missing 3′-OH (no primer, ddNTP) means no extension.",scene:"nuc"},
ligase:{one:"Seals nicks by forming a phosphodiester bond between adjacent DNA pieces.",b:["In cells: joins Okazaki fragments (lagging strand).","In the lab: joins insert to vector (sticky or blunt ends).","Ligase defect → fragments pile up on the lagging strand."],exam:"Digest first, then ligate. Ligase needs compatible ends.",scene:"clone",start:3},
rnapol:{one:"Transcribes genes: builds RNA 5′→3′ from NTPs using a DNA template.",b:["Binds promoters (helped by activators, blocked by repressors).","No primer needed, no proofreading.","Eukaryotes: Pol I → rRNA, Pol II → mRNA and lncRNA, Pol III → tRNA."],exam:"Gene inserted backward relative to the promoter → RNA pol makes the wrong strand's RNA.",scene:"tx",start:1},
spliceosome:{one:"RNA–protein machine that cuts introns out of pre-mRNA and joins the exons.",b:["Its RNA does the catalysis.","Recognizes GU…AG intron ends; signals can differ between species.","Absent in bacteria."],exam:"Moving a gene between organisms with different splicing signals → use cDNA.",scene:"proc",start:3},
ribosome:{one:"Reads mRNA codons and makes peptide bonds. rRNA + proteins, and the rRNA is the catalyst.",b:["Starts at AUG, moves 5′→3′, releases at a stop codon.","Weak ribosome binding → low protein despite normal mRNA.","Viruses use the host's ribosomes."],exam:"Ribosome problems are translation-step failures.",scene:"tl"},
trna:{one:"Adapter molecule: an anticodon on one end, its amino acid on the other.",b:["Anticodon pairs antiparallel with the codon.","Codon 5′-UCA-3′ ↔ anticodon 5′-UGA-3′."],exam:"Anticodon 5′→3′ = reverse complement of the codon (RNA letters).",scene:"tl",start:1},
rt:{one:"Copies RNA into DNA.",b:["Retroviruses (HIV) carry it.","Telomerase is a reverse transcriptase with its own RNA template.","LINE elements encode one.","Lab use: making cDNA from mRNA (oligo-dT primer)."],exam:"Not involved in normal chromosome replication.",scene:"rt",start:2},
telomerase:{one:"Extends chromosome ends (TTAGGG repeats) using its own RNA template.",b:["End-replication problem: the last lagging-strand primer can't be replaced, so ends shorten.","Active in germline, stem, and cancer cells.","Bacteria don't need it: their chromosomes are circular."],exam:"Telomerase = reverse transcriptase."},
rdrp:{one:"RNA-dependent RNA polymerase: copies RNA from an RNA template. Viral.",b:["Host cells have none.","−RNA viruses package it; +RNA viruses make it after infecting."],exam:"Why −RNA genomes alone aren't infectious.",scene:"virus",start:2},
restriction:{one:"Bacterial enzymes that cut DNA at specific palindromic sites (anti-phage defense).",b:["Break phosphodiester bonds on both strands.","Sticky ends (5′ or 3′ overhangs) or blunt ends.","Each enzyme has its own site (EcoRI GAATTC, BamHI GGATCC…).","n cuts: linear → n+1 fragments; circular → n."],exam:"Directional cloning: two enzymes, flanking only, unique in the vector, 5′ end of the gene next to the promoter.",scene:"clone",start:1},
taq:{one:"A heat-stable DNA polymerase from a hot-spring bacterium. That's what makes PCR cycling possible.",b:["Survives 95 °C denaturing every cycle.","Same chemistry as any DNA polymerase."],exam:"PCR needs Taq, template, dNTPs, two primers. No primase, no helicase.",scene:"pcr"},
cas9:{one:"Guide-RNA-directed DNA cutter, borrowed from bacterial CRISPR immunity.",b:["Needs a guide matching the target and a PAM next to it.","Makes a double-strand break.","dCas9 (dead): binds without cutting, used to switch genes on or off."],exam:"No PAM or a guide mismatch → no cut. Gene expression and reading frame don't matter.",scene:"crispr",start:1},
pcr:{one:"Amplifies a specific DNA region exponentially in a tube.",b:["Denature → anneal → extend, ~30 cycles, 2ⁿ copies.","Primers bind opposite strands, 3′ ends pointing inward.","Forward = top strand's 5′ end; reverse = reverse complement of the top's 3′ end."],exam:"You need to know the flanking sequence to design primers.",scene:"pcr"},
sanger:{one:"Reads a DNA sequence using chain-terminating ddNTPs.",b:["Template + one primer + polymerase + dNTPs + a trace of ddNTP (one per tube in the classic method).","Fragments end at every position; separate by size.","Read bottom → top = new strand 5′→3′. Template = reverse complement."],exam:"Matching a gel: bottom band = first base after the primer.",scene:"sanger"},
gel:{one:"Separates DNA fragments by size.",b:["DNA is negative and runs toward +.","Smaller = farther. Compare to a ladder.","Used to check digests, PCR products, and (historically) Sanger reads."],exam:"Fragment sizes in a digest add up to the total length.",scene:"gel"},
cloning:{one:"Putting a gene into a plasmid so bacteria copy it for you.",b:["Vector needs: ori, selectable marker, cloning site (+ promoter for expression).","Digest → ligate → transform E. coli → select → purify plasmid → (move to production host) → induce.","Insert inside a marker gene inactivates it (plate on the other antibiotic)."],exam:"Order of steps, enzyme pair choice, and which antibiotic to plate on.",scene:"clone"},
cdna:{one:"DNA copies of mRNA made by reverse transcriptase, cloned as a cDNA library.",b:["Contains only expressed genes from that tissue, with no introns.","Use it to express eukaryotic genes in bacteria or in hosts with different splicing.","Genomic libraries contain everything (introns, non-coding DNA) and are the same in every tissue."],exam:"Compare cDNA libraries from two tissues to show tissue-specific expression.",scene:"rt"},
rnaseq:{one:"Counts mRNAs to measure gene expression. scRNA-seq does it cell by cell.",b:["mRNA (poly(T) capture) → cDNA → sequence → map → count.","Bulk = average over all cells. Single-cell = barcodes per cell, UMIs per molecule.","rRNA and tRNA are mostly missing (no poly(A))."],exam:"A read split across 200 bp in the genome spans an intron (exon–exon junction).",scene:"scrna"},
crispr:{one:"Programmable genome editing: Cas9 + guide RNA cut a chosen site, and the cell's repair does the edit.",b:["Knockout: NHEJ indels.","Precise edit or insertion: HDR + donor template with homology arms.","Pooled screens: guides depleted (essential/protective genes) or enriched (genes whose loss helps survival)."],exam:"Recessive disease → edit one allele. Guide must match the sequence present now.",scene:"crispr"},
ngs:{one:"Massively parallel sequencing (Illumina): millions of fragments read at once.",b:["Clusters of amplified fragments; one reversible-terminator base added per cycle; read by color.","Reads the new strand 5′→3′ (template = reverse complement).","Better than Sanger for whole genomes; Sanger is best for checking one clone."],exam:"Why NGS for a genome? Parallelism. (It still needs library prep.)"},
viruses:{one:"Obligate parasites: a genome (DNA or RNA) in a protein coat. They use host ribosomes.",b:["+RNA: genome is mRNA. −RNA: carries RdRp. Retrovirus: carries RT, integrates.","Overlapping reading frames pack information.","Bacteria defend with restriction enzymes and CRISPR."],exam:"Which naked genome can start an infection? +RNA.",scene:"virus"},
genome:{one:"The whole DNA sequence of an organism and how it varies.",b:["Human: ~3.2 Gb, ~21,000 genes, ~1.5% coding, >50% transposon-derived.","Conserved sequence → function (selection removes changes).","SNPs, linkage, GWAS: markers near genes track traits.","Homology predicts function of new genes. Gene families and pseudogenes come from duplication."],exam:"Soybean-style statements: mostly non-coding; conserved regions have FEWER mutations.",scene:"genome"}};

const KCOL={core:"var(--core)",proc:"var(--proc)",enz:"var(--enz)",tool:"var(--tool)",virus:"var(--virus)"};
const KNAME={core:"Molecule",proc:"Process",enz:"Enzyme / machine",tool:"Lab tool",virus:"Viruses & genomes"};
const map=document.getElementById("map");
function nodeSize(n){if(n.kind==="core")return{r:58};const w=Math.max(96,n.label.length*8.2+26);return{w,h:n.kind==="proc"?36:30}}
function edgeEnd(n){return[n.x,n.y]}
function drawMap(){let s=`<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs>`;
 s+=`<text x="40" y="660" style="fill:#5a608f;font:600 12px var(--f-mono);letter-spacing:.08em">LAB TOOLS: EACH ONE BORROWS CELL MACHINERY</text>`+`<line x1="40" y1="668" x2="1260" y2="668" stroke="#2d3266" stroke-dasharray="4 6"/>`;
 E.forEach(([a,b,t,lab],i)=>{const A=NODE[a],B=NODE[b];const [x1,y1]=edgeEnd(A),[x2,y2]=edgeEnd(B);const mx=(x1+x2)/2,my=(y1+y2)/2;const dx=x2-x1,dy=y2-y1;const bend=t==="flow"?0:0.12;const cx=mx-dy*bend,cy=my+dx*bend;
  const st=t==="flow"?`stroke="#ecebf7" stroke-width="3" marker-end="url(#ar)"`:t==="works"?`stroke="#ffa53d" stroke-width="1.6" opacity=".7"`:t==="borrow"?`stroke="#a58cff" stroke-width="1.8" stroke-dasharray="6 4" opacity=".85"`:`stroke="#5a608f" stroke-width="1.3" opacity=".8"`;
  s+=`<path class="edge" data-e="${i}" data-a="${a}" data-b="${b}" d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" fill="none" ${st}/>`});
 N.forEach(n=>{const sz=nodeSize(n);const col=KCOL[n.kind];let shape;
  if(n.kind==="core")shape=`<circle class="shape" cx="${n.x}" cy="${n.y}" r="${sz.r}" fill="#1e2246" stroke="${col}" stroke-width="2"/>`+`<text x="${n.x}" y="${n.y+8}" text-anchor="middle" style="fill:${col};font:800 24px var(--f-display)">${n.label}</text>`;
  else shape=`<rect class="shape" x="${n.x-sz.w/2}" y="${n.y-sz.h/2}" width="${sz.w}" height="${sz.h}" rx="${sz.h/2}" fill="#161936" stroke="${col}" stroke-width="${n.kind==="proc"?2:1.5}"/>`+`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" style="fill:${col};font:${n.kind==="proc"?600:500} ${n.kind==="proc"?14:13}px var(--f-body)">${n.label}</text>`;
  s+=`<g class="node" data-id="${n.id}" data-kind="${n.kind}" tabindex="0" role="button" aria-label="${n.label}">${shape}</g>`});
 map.innerHTML=s}
drawMap();

/* ===================== selection, panel, animation ===================== */
const panel=document.getElementById("panel");let SEL=null,STEP=0,TIMER=null,SCN=null,TOUR=null,TI=0;
function neighbors(id){const out=[];E.forEach(([a,b,t,lab],i)=>{if(a===id)out.push({id:b,lab,t,dir:"→"});else if(b===id)out.push({id:a,lab,t,dir:"←"})});return out}
function select(id,opts={}){if(!NODE[id])return;SEL=id;const nb=new Set(neighbors(id).map(x=>x.id).concat([id]));
 map.querySelectorAll(".node").forEach(g=>{g.classList.toggle("sel",g.dataset.id===id);g.classList.toggle("dim",!nb.has(g.dataset.id)&&!isFilteredOut(g.dataset.kind)?true:(!nb.has(g.dataset.id)))});
 map.querySelectorAll(".edge").forEach(p=>{const on=p.dataset.a===id||p.dataset.b===id;p.classList.toggle("hot",on);p.classList.toggle("dim",!on)});
 renderPanel(id,opts.step);try{history.replaceState(null,"","#"+id)}catch(e){}
 if(opts.scroll&&window.innerWidth<1100)panel.scrollIntoView({behavior:"smooth",block:"start"})}
function clearSel(){SEL=null;map.querySelectorAll(".node,.edge").forEach(x=>x.classList.remove("dim","sel","hot"));applyFilter();renderEmpty()}
function renderEmpty(){stopPlay();panel.innerHTML=`<div class="empty"><div class="kind" style="color:var(--uv)">How to use this</div><h2>Click anything on the map</h2><p>The top row is the central dogma: <b>DNA → RNA → protein</b>, with each process on the arrow between them. Enzymes (amber) attach to the processes they work in. Lab tools (violet, bottom) connect with dashed lines to the cell machinery they borrow.</p><p>Each node has a short explanation, its connections (click to jump), and most have a <b>step-by-step animation</b>.</p><p>New to this? Start with the tour <b>Gene → protein</b>.</p></div>`}
function renderPanel(id,startStep){stopPlay();const n=NODE[id],info=INFO[id]||{one:"",b:[]};const nb=neighbors(id);
 let h="";if(TOUR){h+=`<div class="tourbar on"><span><b>Tour: ${TOUR.name}</b>, stop ${TI+1} of ${TOUR.ids.length}</span><button class="btn" id="tprev" ${TI===0?"disabled":""}>← Back</button><button class="btn primary" id="tnext">${TI===TOUR.ids.length-1?"Finish":"Next stop →"}</button><button class="btn" id="tend">Exit</button></div>`}
 h+=`<div class="kind" style="color:${KCOL[n.kind]}">${KNAME[n.kind]}</div><h2>${n.label}</h2><p class="one">${info.one}</p>`;
 if(info.scene){h+=`<div class="stage" id="stage"></div><div class="ctrl"><button class="btn" id="sprev">◀ Back</button><button class="btn primary" id="splay">▶ Play</button><button class="btn" id="snext">Next ▶</button><div class="dots" id="sdots"></div></div><div class="cap" id="scap"></div>`}
 h+=`<h3>Key points</h3><ul>${info.b.map(x=>`<li>${x}</li>`).join("")}</ul>`;
 if(info.exam)h+=`<h3>Exam angle</h3><div class="exam">${info.exam}</div>`;
 h+=`<h3>Connected to</h3><div class="conns">${nb.map(x=>`<button class="conn" data-go="${x.id}">${NODE[x.id].label}<small>${x.dir==="→"?"":""}${x.lab}</small></button>`).join("")}</div>`;
 panel.innerHTML=h;panel.scrollTop=0;
 if(info.scene){SCN=SC[info.scene];document.getElementById("stage").innerHTML=`<svg viewBox="0 0 ${SCN.w} ${SCN.h}" role="img" aria-label="Animation: ${n.label}">${SCN.svg()}</svg>`;STEP=Math.min(startStep??info.start??0,SCN.steps.length-1);applyStep(true)}else SCN=null}
function parseRange(r,step){return r.split(",").some(p=>{if(p.includes("-")){const [a,b]=p.split("-");return step>=+a&&(b===""||step<=+b)}return +p===step})}
function lastKey(spec,step){let v=null;spec.split(";").filter(Boolean).forEach(kv=>{const [k,val]=kv.split(":");if(+k<=step)v=val});return v}
function applyStep(instant){const st=document.getElementById("stage");if(!st||!SCN)return;
 st.querySelectorAll("[data-s],[data-m],[data-o]").forEach(el=>{if(instant)el.style.transition="none";
  if(el.dataset.s!=null)el.style.opacity=parseRange(el.dataset.s,STEP)?1:0;
  if(el.dataset.m){const v=lastKey(el.dataset.m,STEP);const [x,y]=(v||"0,0").split(",").map(Number);el.style.transform=`translate(${x}px,${y}px)`}
  if(el.dataset.o){const v=lastKey(el.dataset.o,STEP);el.style.strokeDashoffset=v==null?1:v}
  if(instant){void el.getBoundingClientRect();el.style.transition=""}});
 document.getElementById("scap").innerHTML=`<b>${STEP+1}/${SCN.steps.length}</b> · ${SCN.steps[STEP]}`;
 document.getElementById("sdots").innerHTML=SCN.steps.map((_,i)=>`<i class="${i===STEP?"on":""}"></i>`).join("");
 document.getElementById("sprev").disabled=STEP===0;document.getElementById("snext").disabled=STEP===SCN.steps.length-1}
function go(d){if(!SCN)return;STEP=Math.max(0,Math.min(SCN.steps.length-1,STEP+d));applyStep(false)}
function stopPlay(){if(TIMER){clearInterval(TIMER);TIMER=null}const b=document.getElementById("splay");if(b)b.textContent="▶ Play"}
function togglePlay(){if(TIMER){stopPlay();return}if(STEP===SCN.steps.length-1){STEP=0;applyStep(true)}document.getElementById("splay").textContent="❚❚ Pause";TIMER=setInterval(()=>{if(STEP>=SCN.steps.length-1){stopPlay();return}go(1)},3200)}

/* ===================== filters & tours ===================== */
const FILT={core:true,proc:true,enz:true,tool:true,virus:true};const isFilteredOut=k=>!FILT[k];
function applyFilter(){map.querySelectorAll(".node").forEach(g=>{if(!SEL)g.classList.toggle("dim",!FILT[g.dataset.kind])});map.querySelectorAll(".edge").forEach(p=>{if(!SEL)p.classList.toggle("dim",!(FILT[NODE[p.dataset.a].kind]&&FILT[NODE[p.dataset.b].kind]))})}
const fb=document.getElementById("filters");Object.keys(KNAME).forEach(k=>{const b=document.createElement("button");b.className="chipbtn";b.setAttribute("aria-pressed","true");b.textContent=KNAME[k];b.onclick=()=>{FILT[k]=!FILT[k];b.setAttribute("aria-pressed",FILT[k]);if(SEL)clearSel();applyFilter()};fb.appendChild(b)});
const TOURS=[{name:"Gene → protein",ids:["dna","transcription","rnapol","regulation","processing","translation","trna","protein","mutations"]},{name:"How cells copy DNA",ids:["dna","replication","helicase","topo","primase","dnapol","ligase","repair","telomerase"]},{name:"Lab tools borrow cell machinery",ids:["restriction","cloning","pcr","sanger","gel","cdna","rnaseq","ngs","crispr"]},{name:"Viruses & reverse flow",ids:["viruses","rnarep","rdrp","rtproc","rt","genome"]}];
const tb=document.getElementById("tours");TOURS.forEach((t,i)=>{const b=document.createElement("button");b.className="chipbtn";b.textContent=t.name;b.onclick=()=>{TOUR=t;TI=0;select(t.ids[0],{scroll:true})};tb.appendChild(b)});

/* ===================== events ===================== */
map.addEventListener("click",e=>{const g=e.target.closest(".node");if(g){if(TOUR&&!TOUR.ids.includes(g.dataset.id))TOUR=null;select(g.dataset.id,{scroll:true})}else if(SEL&&!TOUR)clearSel()});
map.addEventListener("keydown",e=>{const g=e.target.closest(".node");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();select(g.dataset.id,{scroll:true})}});
panel.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.dataset.go){if(TOUR&&!TOUR.ids.includes(t.dataset.go))TOUR=null;select(t.dataset.go);return}
 if(t.id==="snext")return go(1);if(t.id==="sprev")return go(-1);if(t.id==="splay")return togglePlay();
 if(t.id==="tnext"){if(TI<TOUR.ids.length-1){TI++;select(TOUR.ids[TI])}else{TOUR=null;clearSel()}return}
 if(t.id==="tprev"){TI=Math.max(0,TI-1);select(TOUR.ids[TI]);return}
 if(t.id==="tend"){TOUR=null;select(SEL);return}});
document.addEventListener("keydown",e=>{if(!SCN||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
const h0=location.hash.slice(1);if(NODE[h0])select(h0);else renderEmpty();
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(NODE[h]&&h!==SEL)select(h)});
</script>
</body>
</html>
